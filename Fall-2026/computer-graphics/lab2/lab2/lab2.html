<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html;charset=utf-8" >
            <title>Lab 2</title>
            <script type="text/javascript" src="../Common/webgl-utils.js"></script>
            <script type="text/javascript" src="../Common/initShaders.js"></script>
            <script type="text/javascript" src="../Common/MV.js"></script>
            <script type="text/javascript" src="lab2.js"></script>
            
            <script type="x-shader/x-vertex" id="vertex-shader">
                attribute vec4 myPosition;
				uniform float theta;
				uniform vec2 move;
				
                void main() {
					float xi, yi, xf, yf;
					xi = myPosition.x;
					yi = myPosition.y;
					
					xf =   xi * cos( theta ) + yi * sin( theta ) + move.x;
					yf =  -xi * sin( theta ) + yi * cos( theta ) + move.y;
				
                    gl_Position.x = xf;
					gl_Position.y = yf;
					gl_Position.z = 0.0;
					gl_Position.w = 1.0;
					
                }
                </script>
            
            <script type="x-shader/x-fragment" id="fragment-shader">
                void main() {
                    gl_FragColor = vec4( 0.25, 0.25, 0.25, 1.0 );
                }
            </script>
    </head>
    
    <body onload="init()" onkeydown="moveSquareKeys(event)">
        <canvas width="1024" height="1024" id="gl-canvas" onclick="moveSquare(event)">
        </canvas>
		<button id="startRotate" onclick="startAnim()">StartRotate</button>
		<button id="startRotate" onclick="stopAnim()">StopRotate</button>
		<button id="Increase" onclick="increase()">Increase</button>
		<button id="Decrease" onclick="decrease()">Decrease</button>
    </body>
</html>
